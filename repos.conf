# Balikar Repository Configuration
# System-wide configuration file
#
# Format:
#   [repository-name]
#   url = <local-path-or-remote-url>
#   priority = <number>  (higher = preferred)
#   enabled = true/false

# Official Balikar repository on GitHub (highest priority for testing)
[balikar-official]
url = https://raw.githubusercontent.com/JanPL00/balikar-repository/main
priority = 100
enabled = true

# Local development repository (lower priority)
[local-dev]
url = ./repo
priority = 50
enabled = true
